services:
  frontend:
    build:
      context: .
    command: npm run dev-docker
    ports:
      - 5173:5173
    volumes:
      # bind node_modules for local development LSP to pick them up
      # and package(-lock).json so that we can add package from within the containerized env
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./node_modules:/app/node_modules
    env_file:
      - ./.env
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: sync
          path: ./
          target: /app/
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .env
  firebase:
    build:
      context: .
      dockerfile: ./docker/firebase/Dockerfile
    ports: ["9099:9099", "4000:4000"]
    volumes:
      - ./docker/firebase/data:/firebase/data
