services:
  frontend:
    build:
      context: .
    command: npm run dev-docker
    ports:
      - 5173:5173
    volumes:
      # bind node_modules for local development LSP to pick them up
      - ./node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./src/
          target: /app/src/
          initial_sync: true
          ignore:
            - node_modules
        - action: rebuild
          path: ./package.json
